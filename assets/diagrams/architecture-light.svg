<svg xmlns="http://www.w3.org/2000/svg" width="964" height="372" viewBox="-2 0 964 372" role="img" aria-label="TabSaver architecture: the popup and the service worker both read and write chrome.storage.local and use the chrome.tabs and tabGroups APIs. The toolbar icon opens the popup; the keyboard shortcut, right-click menu and alarms go to the service worker.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f1f1f"/></marker>
    <style>
      text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .t { font-size: 13px; font-weight: 700; fill: #1f1f1f; }
      .m { font-size: 11.5px; fill: #6b6b6b; }
      .s { font-size: 10.5px; fill: #6b6b6b; }
      .e { fill: none; stroke: #1f1f1f; stroke-width: 1.25; stroke-dasharray: 4 4; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -16; } }
      @media (prefers-reduced-motion: reduce) { .e { animation: none; } }
    </style>
  </defs>
  <rect x="0" y="20" width="200" height="56" rx="6" fill="#1f1f1f" fill-opacity=".035" stroke="#1f1f1f" stroke-width="1.25"/>
  <text x="14" y="44" class="t">toolbar icon</text>
  <text x="14" y="66" class="m">or Ctrl+Shift+T</text>
  <rect x="0" y="92" width="200" height="56" rx="6" fill="#1f1f1f" fill-opacity=".035" stroke="#1f1f1f" stroke-width="1.25"/>
  <text x="14" y="116" class="t">Ctrl+Shift+S</text>
  <text x="14" y="138" class="m">quick save</text>
  <rect x="0" y="164" width="200" height="56" rx="6" fill="#1f1f1f" fill-opacity=".035" stroke="#1f1f1f" stroke-width="1.25"/>
  <text x="14" y="188" class="t">right-click menu</text>
  <text x="14" y="210" class="m">save all / this tab</text>
  <rect x="0" y="236" width="200" height="84" rx="6" fill="#1f1f1f" fill-opacity=".035" stroke="#1f1f1f" stroke-width="1.25"/>
  <text x="14" y="260" class="t">chrome.alarms</text>
  <text x="14" y="282" class="m">auto-save interval</text>
  <text x="14" y="300" class="m">live sync interval</text>
  <rect x="300" y="20" width="260" height="130" rx="6" fill="#1f1f1f" fill-opacity=".035" stroke="#1f1f1f" stroke-width="1.25"/>
  <text x="314" y="44" class="t">popup</text>
  <text x="314" y="66" class="m">popup.html / popup.js</text>
  <text x="314" y="84" class="m">save, restore, preview,</text>
  <text x="314" y="102" class="m">tags, search, cleanup,</text>
  <text x="314" y="120" class="m">import / export</text>
  <rect x="300" y="230" width="260" height="130" rx="6" fill="#1f1f1f" fill-opacity=".035" stroke="#1f1f1f" stroke-width="1.25"/>
  <text x="314" y="254" class="t">service worker</text>
  <text x="314" y="276" class="m">background.js</text>
  <text x="314" y="294" class="m">quick save, menus,</text>
  <text x="314" y="312" class="m">auto-save, live sync,</text>
  <text x="314" y="330" class="m">badge count</text>
  <rect x="680" y="20" width="280" height="130" rx="6" fill="#1f1f1f" fill-opacity=".035" stroke="#1f1f1f" stroke-width="1.25"/>
  <text x="694" y="44" class="t">chrome.tabs / tabGroups</text>
  <text x="694" y="66" class="m">read open tabs and groups</text>
  <text x="694" y="84" class="m">open tabs, rebuild groups</text>
  <text x="694" y="102" class="m">captureVisibleTab</text>
  <text x="694" y="120" class="m">close duplicates</text>
  <rect x="680" y="230" width="280" height="130" rx="6" fill="#1f1f1f" fill-opacity=".035" stroke="#1f1f1f" stroke-width="1.25"/>
  <text x="694" y="254" class="t">chrome.storage.local</text>
  <text x="694" y="276" class="m">sessions[]</text>
  <text x="694" y="294" class="m">tabSaverSettings</text>
  <text x="694" y="312" class="m">darkMode</text>
  <text x="694" y="330" class="m">stays on this device</text>
  <path class="e" d="M200 48 L296 62" marker-end="url(#a)"/>
  <path class="e" d="M200 120 C 250 120, 250 262, 296 262" marker-end="url(#a)"/>
  <path class="e" d="M200 192 C 250 192, 250 292, 296 292" marker-end="url(#a)"/>
  <path class="e" d="M200 272 C 250 272, 250 322, 296 322" marker-end="url(#a)"/>
  <path class="e" d="M430 150 L430 226" marker-end="url(#a)"/>
  <path class="e" d="M560 66 L676 66" marker-end="url(#a)"/>
  <path class="e" d="M560 120 C 620 120, 620 280, 676 280" marker-end="url(#a)"/>
  <path class="e" d="M560 320 L676 320" marker-end="url(#a)"/>
  <path class="e" d="M560 250 C 620 250, 620 116, 676 116" marker-end="url(#a)"/>
  <text x="440" y="192" class="s">runtime.sendMessage</text><text x="584" y="58" class="s">read / open</text><text x="590" y="312" class="s">get / set</text>
</svg>
