<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="TabSaver: save, organize and restore your browser sessions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset=".55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0c3a5e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="20"/></clipPath>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; }
      .float { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float 7s ease-in-out infinite reverse; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }

      .tab { opacity: 0; transform-box: fill-box; transform-origin: center; animation: fly 6s cubic-bezier(.5,0,.2,1) infinite; }
      .t1 { animation-delay: 0s; } .t2 { animation-delay: .25s; } .t3 { animation-delay: .5s; } .t4 { animation-delay: .75s; } .t5 { animation-delay: 1s; }
      @keyframes fly {
        0%   { opacity: 0; transform: translate(0,0) scale(1); }
        6%   { opacity: 1; transform: translate(0,0) scale(1); }
        28%  { opacity: 1; transform: translate(0,0) scale(1); }
        46%  { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); }
        100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); }
      }
      .folder { transform-origin: 980px 250px; animation: gulp 6s ease-in-out infinite; }
      @keyframes gulp { 0%,40% { transform: scale(1) } 48% { transform: scale(1.08) } 56%,100% { transform: scale(1) } }
      .check { opacity: 0; animation: check 6s ease-out infinite; }
      @keyframes check { 0%,48% { opacity: 0; transform: translateY(6px) } 56%,88% { opacity: 1; transform: translateY(0) } 100% { opacity: 0 } }
      .badge { animation: pop 6s ease-out infinite; transform-origin: 1043px 182px; }
      @keyframes pop { 0%,50% { transform: scale(1) } 56% { transform: scale(1.35) } 64%,100% { transform: scale(1) } }
      .n4 { animation: n4 6s steps(1) infinite; } .n5 { animation: n5 6s steps(1) infinite; }
      @keyframes n4 { 0% { opacity: 1 } 52% { opacity: 0 } 100% { opacity: 1 } }
      @keyframes n5 { 0% { opacity: 0 } 52% { opacity: 1 } 100% { opacity: 0 } }
      .shine { animation: shine 6s linear infinite; }
      @keyframes shine { 0% { transform: translateX(-300px) } 100% { transform: translateX(900px) } }
      .pulse { animation: pulse 2.4s ease-out infinite; transform-origin: 40px 56px; }
      @keyframes pulse { 0% { opacity: .6; transform: scale(1) } 100% { opacity: 0; transform: scale(1.6) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .tab { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle class="float" cx="220" cy="40" r="260" fill="url(#glowA)"/>
    <circle class="float2" cx="1050" cy="360" r="280" fill="url(#glowB)"/>

    <!-- Logo -->
    <g transform="translate(64 54)">
      <rect class="pulse" x="0" y="16" width="80" height="80" rx="20" fill="none" stroke="#818cf8" stroke-width="2"/>
      <rect x="0" y="16" width="80" height="80" rx="20" fill="url(#brand)"/>
      <path d="M20 43a4 4 0 014-4h10l4 5h18a4 4 0 014 4v20a4 4 0 01-4 4H24a4 4 0 01-4-4z" fill="#fff" opacity=".95"/>
      <path d="M40 51v13m0 0l-4.5-4.5M40 64l4.5-4.5" stroke="url(#brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <text x="168" y="128" font-size="64" font-weight="800" fill="url(#title)" letter-spacing="-1.5">TabSaver</text>
    <text x="66" y="196" font-size="25" font-weight="500" fill="#e0e7ff">Save, organize &amp; restore your browser sessions.</text>
    <text x="66" y="232" font-size="18" fill="#a5b4fc">Visual thumbnails · Tab groups · Live Sync · Auto-save · 100% local</text>

    <!-- Pills -->
    <g font-size="14" font-weight="600">
      <rect x="66" y="270" width="92" height="32" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".2"/>
      <text x="112" y="291" text-anchor="middle" fill="#fff">v2.1.1</text>
      <rect x="168" y="270" width="146" height="32" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".2"/>
      <text x="241" y="291" text-anchor="middle" fill="#fff">Manifest V3</text>
      <rect x="324" y="270" width="176" height="32" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".2"/>
      <text x="412" y="291" text-anchor="middle" fill="#fff">Zero dependencies</text>
      <rect x="510" y="270" width="150" height="32" rx="16" fill="#22c55e" fill-opacity=".18" stroke="#4ade80" stroke-opacity=".5"/>
      <text x="585" y="291" text-anchor="middle" fill="#bbf7d0">No tracking</text>
    </g>

    <!-- Tabs flying into the folder -->
    <g font-size="13" font-weight="600" fill="#e2e8f0">
      <g class="tab t1" style="--dx:200px;--dy:150px"><rect x="700" y="60" width="150" height="34" rx="9" fill="#1e293b" stroke="#475569"/><rect x="711" y="69" width="16" height="16" rx="4" fill="#a855f7"/><text x="735" y="82">Pull request</text></g>
      <g class="tab t2" style="--dx:150px;--dy:110px"><rect x="760" y="104" width="150" height="34" rx="9" fill="#1e293b" stroke="#475569"/><rect x="771" y="113" width="16" height="16" rx="4" fill="#3b82f6"/><text x="795" y="126">API docs</text></g>
      <g class="tab t3" style="--dx:230px;--dy:60px"><rect x="680" y="150" width="150" height="34" rx="9" fill="#1e293b" stroke="#475569"/><rect x="691" y="159" width="16" height="16" rx="4" fill="#f59e0b"/><text x="715" y="172">Analytics</text></g>
      <g class="tab t4" style="--dx:120px;--dy:30px"><rect x="790" y="190" width="150" height="34" rx="9" fill="#1e293b" stroke="#475569"/><rect x="801" y="199" width="16" height="16" rx="4" fill="#ef4444"/><text x="825" y="212">Lo-fi beats</text></g>
      <g class="tab t5" style="--dx:210px;--dy:-10px"><rect x="700" y="236" width="150" height="34" rx="9" fill="#1e293b" stroke="#475569"/><rect x="711" y="245" width="16" height="16" rx="4" fill="#10b981"/><text x="735" y="258">Figma file</text></g>
    </g>

    <!-- Session folder card -->
    <g class="folder">
      <rect x="900" y="180" width="200" height="140" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#a5b4fc" stroke-opacity=".5"/>
      <path d="M930 218a8 8 0 018-8h26l9 11h59a8 8 0 018 8v58a8 8 0 01-8 8h-94a8 8 0 01-8-8z" fill="url(#brand)"/>
      <text x="1000" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Session</text>
      <g class="badge">
        <circle cx="1043" cy="182" r="16" fill="#3b82f6" stroke="#0b1020" stroke-width="3"/>
        <text class="n4" x="1043" y="188" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">4</text>
        <text class="n5" x="1043" y="188" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">5</text>
      </g>
    </g>
    <g class="check">
      <rect x="912" y="330" width="176" height="30" rx="15" fill="#16a34a"/>
      <path d="M930 345l5 5 9-10" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1008" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Session saved</text>
    </g>

    <rect class="shine" x="0" y="0" width="120" height="380" fill="#ffffff" fill-opacity=".03" transform="skewX(-20)"/>
  </g>
</svg>
