<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Auto-save creates a new snapshot session on every tick and keeps the five most recent; Live Sync updates the same chosen sessions in place on its own interval">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="thumbA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; }
      .h { font-size: 19px; font-weight: 800; fill: #f8fafc; }
      .s { font-size: 13px; fill: #94a3b8; }
      .k { font-size: 12px; font-weight: 600; fill: #e2e8f0; }
      .m { font-size: 11px; fill: #94a3b8; }
      .axis { stroke: #334155; stroke-width: 2; }

      .play { animation: play 10s linear infinite; }
      @keyframes play { from { transform: translateX(0) } to { transform: translateX(980px) } }

      .snap { opacity: 0; transform-box: fill-box; transform-origin: center top; }
      .c1 { animation: c1 10s ease-out infinite; } .c2 { animation: c2 10s ease-out infinite; } .c3 { animation: c3 10s ease-out infinite; }
      .c4 { animation: c4 10s ease-out infinite; } .c5 { animation: c5 10s ease-out infinite; } .c6 { animation: c6 10s ease-out infinite; }
      @keyframes c1 { 0%,8% { opacity: 0; transform: translateY(-14px) scale(.9) } 11%,78% { opacity: 1; transform: none } 83%,100% { opacity: 0; transform: translateY(18px) scale(.9) } }
      @keyframes c2 { 0%,22% { opacity: 0; transform: translateY(-14px) scale(.9) } 25%,95% { opacity: 1; transform: none } 100% { opacity: 0 } }
      @keyframes c3 { 0%,36% { opacity: 0; transform: translateY(-14px) scale(.9) } 39%,95% { opacity: 1; transform: none } 100% { opacity: 0 } }
      @keyframes c4 { 0%,50% { opacity: 0; transform: translateY(-14px) scale(.9) } 53%,95% { opacity: 1; transform: none } 100% { opacity: 0 } }
      @keyframes c5 { 0%,64% { opacity: 0; transform: translateY(-14px) scale(.9) } 67%,95% { opacity: 1; transform: none } 100% { opacity: 0 } }
      @keyframes c6 { 0%,78% { opacity: 0; transform: translateY(-14px) scale(.9) } 81%,95% { opacity: 1; transform: none } 100% { opacity: 0 } }
      .evict { opacity: 0; animation: evict 10s ease-out infinite; }
      @keyframes evict { 0%,79% { opacity: 0 } 83%,95% { opacity: 1 } 100% { opacity: 0 } }

      .ping { opacity: 0; transform-box: fill-box; transform-origin: center; }
      .pa { animation: pa 10s ease-out infinite; } .pb { animation: pb 10s ease-out infinite; } .pc { animation: pc 10s ease-out infinite; }
      @keyframes pa { 0%,22% { opacity: 0; transform: scale(.4) } 23% { opacity: 1 } 30%,100% { opacity: 0; transform: scale(2.2) } }
      @keyframes pb { 0%,50% { opacity: 0; transform: scale(.4) } 51% { opacity: 1 } 58%,100% { opacity: 0; transform: scale(2.2) } }
      @keyframes pc { 0%,78% { opacity: 0; transform: scale(.4) } 79% { opacity: 1 } 86%,100% { opacity: 0; transform: scale(2.2) } }

      .v0 { animation: v0 10s steps(1) infinite; } .v1 { opacity: 0; animation: v1 10s steps(1) infinite; }
      .v2 { opacity: 0; animation: v2 10s steps(1) infinite; } .v3 { opacity: 0; animation: v3 10s steps(1) infinite; }
      @keyframes v0 { 0% { opacity: 1 } 22% { opacity: 0 } }
      @keyframes v1 { 0% { opacity: 0 } 22% { opacity: 1 } 50% { opacity: 0 } }
      @keyframes v2 { 0% { opacity: 0 } 50% { opacity: 1 } 78% { opacity: 0 } }
      @keyframes v3 { 0% { opacity: 0 } 78% { opacity: 1 } }
      .flash { opacity: 0; animation: flash 10s ease-out infinite; }
      @keyframes flash { 0%,22% { opacity: 0 } 23% { opacity: .9 } 27% { opacity: 0 } 50% { opacity: 0 } 51% { opacity: .9 } 55% { opacity: 0 } 78% { opacity: 0 } 79% { opacity: .9 } 83%,100% { opacity: 0 } }
      .spin { animation: spin 2s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes spin { to { transform: rotate(360deg) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .snap { opacity: 1; } .c1 { opacity: .35; } .v1, .v2 { opacity: 0 } }
    </style>
  </defs>

  <rect width="1200" height="470" rx="20" fill="url(#bg)"/>
  <text x="40" y="48" font-size="22" font-weight="800" fill="#f8fafc">Two background engines, two independent intervals</text>
  <text x="40" y="72" class="s">Both run from chrome.alarms in the service worker, even with the popup closed</text>

  <!-- ===== Lane 1: Auto-save ===== -->
  <g transform="translate(0 100)">
    <rect x="30" y="0" width="1140" height="160" rx="16" fill="#ffffff" fill-opacity=".03" stroke="#334155"/>
    <text x="52" y="32" class="h">💾 Auto-save</text>
    <text x="52" y="54" class="s">A new snapshot session on every tick · keeps the 5 most recent</text>
    <line x1="120" y1="80" x2="1100" y2="80" class="axis"/>
    <g fill="#f59e0b">
      <circle cx="198" cy="80" r="5"/><circle cx="335" cy="80" r="5"/><circle cx="473" cy="80" r="5"/>
      <circle cx="610" cy="80" r="5"/><circle cx="747" cy="80" r="5"/><circle cx="884" cy="80" r="5"/>
    </g>
    <g>
      <g class="snap c1"><rect x="143" y="94" width="110" height="52" rx="9" fill="#1e293b" stroke="#f59e0b" stroke-opacity=".6"/><text x="155" y="115" class="k">Auto-save 09:00</text><text x="155" y="134" class="m">8 tabs · auto</text></g>
      <g class="snap c2"><rect x="280" y="94" width="110" height="52" rx="9" fill="#1e293b" stroke="#f59e0b" stroke-opacity=".6"/><text x="292" y="115" class="k">Auto-save 09:30</text><text x="292" y="134" class="m">9 tabs · auto</text></g>
      <g class="snap c3"><rect x="418" y="94" width="110" height="52" rx="9" fill="#1e293b" stroke="#f59e0b" stroke-opacity=".6"/><text x="430" y="115" class="k">Auto-save 10:00</text><text x="430" y="134" class="m">11 tabs · auto</text></g>
      <g class="snap c4"><rect x="555" y="94" width="110" height="52" rx="9" fill="#1e293b" stroke="#f59e0b" stroke-opacity=".6"/><text x="567" y="115" class="k">Auto-save 10:30</text><text x="567" y="134" class="m">11 tabs · auto</text></g>
      <g class="snap c5"><rect x="692" y="94" width="110" height="52" rx="9" fill="#1e293b" stroke="#f59e0b" stroke-opacity=".6"/><text x="704" y="115" class="k">Auto-save 11:00</text><text x="704" y="134" class="m">7 tabs · auto</text></g>
      <g class="snap c6"><rect x="829" y="94" width="110" height="52" rx="9" fill="#1e293b" stroke="#f59e0b" stroke-opacity=".6"/><text x="841" y="115" class="k">Auto-save 11:30</text><text x="841" y="134" class="m">10 tabs · auto</text></g>
    </g>
    <g class="evict"><rect x="960" y="100" width="190" height="40" rx="10" fill="#7f1d1d" fill-opacity=".5" stroke="#f87171" stroke-opacity=".6"/><text x="976" y="125" class="k" fill="#fecaca">🗑 oldest backup dropped</text></g>
  </g>

  <!-- ===== Lane 2: Live Sync ===== -->
  <g transform="translate(0 280)">
    <rect x="30" y="0" width="1140" height="160" rx="16" fill="#ffffff" fill-opacity=".03" stroke="#334155"/>
    <text x="52" y="32" class="h">🔄 Live Sync</text>
    <text x="52" y="54" class="s">Sessions you mark with the sync button are overwritten in place on each tick</text>
    <line x1="120" y1="80" x2="1100" y2="80" class="axis"/>
    <g fill="#3b82f6">
      <circle cx="336" cy="80" r="5"/><circle cx="610" cy="80" r="5"/><circle cx="884" cy="80" r="5"/>
    </g>
    <g fill="none" stroke="#60a5fa" stroke-width="2">
      <circle class="ping pa" cx="336" cy="80" r="8"/><circle class="ping pb" cx="610" cy="80" r="8"/><circle class="ping pc" cx="884" cy="80" r="8"/>
    </g>
    <!-- The one living session -->
    <g transform="translate(400 92)">
      <rect width="400" height="58" rx="11" fill="#1e293b" stroke="#3b82f6"/>
      <rect class="flash" width="400" height="58" rx="11" fill="#3b82f6" fill-opacity=".25"/>
      <rect x="10" y="9" width="64" height="40" rx="6" fill="url(#thumbA)" stroke="#475569"/>
      <rect x="18" y="17" width="30" height="4" rx="2" fill="#c084fc"/><rect x="18" y="25" width="44" height="4" rx="2" fill="#64748b"/><rect x="18" y="33" width="36" height="4" rx="2" fill="#64748b"/>
      <text x="88" y="27" class="k" font-size="14">Frontend Sprint 14</text>
      <text class="v0 m" x="88" y="45">8 tabs · updated 9:00</text>
      <text class="v1 m" x="88" y="45">10 tabs · updated 9:45</text>
      <text class="v2 m" x="88" y="45">12 tabs · updated 10:30</text>
      <text class="v3 m" x="88" y="45">9 tabs · updated 11:15</text>
      <g transform="translate(362 19)">
        <rect x="-6" y="-6" width="32" height="32" rx="8" fill="#3b82f6" fill-opacity=".18"/>
        <g class="spin"><path d="M3 3v5h.5m14.7 2A7.5 7.5 0 003.5 8m0 0H8m11 11v-5h-.5m0 0a7.5 7.5 0 01-14.7-2m14.7 2H14" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="scale(.95)"/></g>
      </g>
    </g>
  </g>

  <!-- Playhead across both lanes -->
  <g class="play">
    <line x1="120" y1="168" x2="120" y2="372" stroke="#e2e8f0" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="120" cy="180" r="6" fill="#f59e0b"/>
    <circle cx="120" cy="360" r="6" fill="#3b82f6"/>
  </g>
</svg>
